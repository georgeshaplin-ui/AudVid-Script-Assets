name: runpod-worker image

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "runpod-worker/**"
      - ".github/workflows/runpod-worker.yml"

concurrency:
  group: runpod-worker-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free runner disk (image is ~12 GB)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tag
        id: meta
        run: echo "tag=v$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: runpod-worker
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/audvid-whisperx:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/audvid-whisperx:latest

      - name: Summary
        run: echo "Image pushed — deploy with deploy-runpod.ps1 -Image ${{ secrets.DOCKERHUB_USERNAME }}/audvid-whisperx:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
